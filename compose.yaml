services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: animals
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d animals"]
      interval: 5s
      timeout: 3s
      retries: 10

  client:
    build: ./client
    environment:
      DOCKER_DEV: "1"
    ports:
      - "5001:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

  server:
    build: ./server
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "5000"
      DATABASE_URL: postgres://postgres:admin@db:5432/animals
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "npx sequelize-cli db:migrate && npx nodemon -L index.js"]

volumes:
  pg_data: